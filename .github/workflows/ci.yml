name: Desktop packages

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app-server-protocol:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - codex-version: "0.143.0"
            audioSchema: "false"
          - codex-version: "latest"
            audioSchema: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --global @openai/codex@${{ matrix.codex-version }}
      - run: npm run test:app-server
        env:
          TUXCODEX_EXPECT_AUDIO_SCHEMA: ${{ matrix.audioSchema }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report-app-server-${{ matrix.codex-version }}
          path: test-results/app-server.xml
          if-no-files-found: warn

  ubuntu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install Tauri prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev xvfb xauth xdotool
      - run: npm ci
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report-ubuntu
          path: |
            test-results/frontend.xml
            coverage/
          if-no-files-found: warn
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npm run tauri build -- --bundles deb
      - run: bash scripts/smoke-linux-window.sh "$PWD/src-tauri/target/release/tuxcodex"
      - run: |
          for package in src-tauri/target/release/bundle/deb/*.deb; do
            test -f "$package"
            mv "$package" "${package%.deb}_ubuntu24.deb"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: tuxcodex-ubuntu24-amd64
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

  ubuntu-22:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install Tauri and window test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev xvfb xauth xdotool
      - run: npm ci
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report-ubuntu22
          path: test-results/frontend.xml
          if-no-files-found: warn
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npm run tauri build -- --bundles deb
      - run: bash scripts/smoke-linux-window.sh "$PWD/src-tauri/target/release/tuxcodex"
      - run: |
          for package in src-tauri/target/release/bundle/deb/*.deb; do
            test -f "$package"
            mv "$package" "${package%.deb}_ubuntu22.deb"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: tuxcodex-ubuntu22-amd64
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

  fedora:
    runs-on: ubuntu-24.04
    container: fedora:43
    steps:
      - name: Install Fedora build tools
        run: |
          dnf install -y git tar gzip unzip findutils curl wget file nodejs npm gcc gcc-c++ make pkgconf-pkg-config openssl-devel webkit2gtk4.1-devel libappindicator-gtk3-devel librsvg2-devel libxdo-devel rpm-build patchelf
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - run: npm ci
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report-fedora
          path: test-results/frontend.xml
          if-no-files-found: warn
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npm run tauri build -- --bundles rpm
      - uses: actions/upload-artifact@v4
        with:
          name: tuxcodex-fedora-x86_64
          path: src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report-windows
          path: test-results/frontend.xml
          if-no-files-found: warn
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npm run tauri build -- --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: tuxcodex-windows-x64
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            label: arm64
          - runner: macos-15
            target: x86_64-apple-darwin
            label: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report-macos-${{ matrix.label }}
          path: test-results/frontend.xml
          if-no-files-found: warn
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npm run tauri build -- --target ${{ matrix.target }} --bundles dmg
      - uses: actions/upload-artifact@v4
        with:
          name: tuxcodex-macos-${{ matrix.label }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [app-server-protocol, ubuntu, ubuntu-22, fedora, windows, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: tuxcodex-*
          path: release-assets
          merge-multiple: true
      - name: Publish installers to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(find release-assets -maxdepth 1 -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.exe' -o -name '*.dmg' \) | wc -l)" -eq 6
          cd release-assets
          sha256sum *.deb *.rpm *.exe *.dmg > SHA256SUMS.txt
          cd ..
          gh release create "$GITHUB_REF_NAME" release-assets/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "TuxCodex $GITHUB_REF_NAME" --prerelease --generate-notes
